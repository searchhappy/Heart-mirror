<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心语镜像</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap');

  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: rgba(99,179,237,0.15);
    --accent: #63b3ed;
    --accent2: #9f7aea;
    --accent3: #68d391;
    --text: #e2e8f0;
    --text-muted: #718096;
    --danger: #fc8181;
    --glow: rgba(99,179,237,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans SC', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 背景光晕 */
  body::before {
    content: '';
    position: fixed;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(99,179,237,0.06) 0%, transparent 70%);
    top: -100px; left: -100px;
    pointer-events: none;
    animation: drift 12s ease-in-out infinite alternate;
  }
  body::after {
    content: '';
    position: fixed;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(159,122,234,0.06) 0%, transparent 70%);
    bottom: -100px; right: -100px;
    pointer-events: none;
    animation: drift 15s ease-in-out infinite alternate-reverse;
  }
  @keyframes drift {
    from { transform: translate(0,0); }
    to { transform: translate(60px, 40px); }
  }

  /* 顶部标题栏 */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px);
    background: rgba(10,14,26,0.8);
    position: sticky; top: 0; z-index: 100;
  }
  .logo {
    font-family: 'Noto Serif SC', serif;
    font-size: 1.4rem;
    font-weight: 600;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.05em;
  }
  .logo span { font-size: 0.75rem; font-weight: 300; opacity: 0.6; margin-left: 8px; font-family: 'Noto Sans SC'; -webkit-text-fill-color: var(--text-muted); }

  /* 状态指示器 */
  .status-bar {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .status-dot {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.75rem; color: var(--text-muted);
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
  }
  .dot.active {
    background: var(--accent3);
    box-shadow: 0 0 8px var(--accent3);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* 主布局 */
  .main {
    display: grid;
    grid-template-columns: 1fr 380px;
    grid-template-rows: auto 1fr;
    gap: 0;
    height: calc(100vh - 65px);
  }

  /* 左侧聊天区 */
  .chat-area {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    overflow: hidden;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .message {
    display: flex;
    gap: 12px;
    animation: fadeUp 0.3s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.user { flex-direction: row-reverse; }

  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem;
    flex-shrink: 0;
  }
  .avatar.ai {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 0 16px var(--glow);
  }
  .avatar.user-av {
    background: var(--surface2);
    border: 1px solid var(--border);
  }

  .bubble {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 0.9rem;
    line-height: 1.7;
    word-break: break-word;  /* 加上这行，防止长词不换行 */
    min-width: 80px;         /* 加上这行，保证最小宽度 */
  }
  .message.ai .bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }
  .message.user .bubble {
    background: linear-gradient(135deg, rgba(99,179,237,0.2), rgba(159,122,234,0.2));
    border: 1px solid rgba(99,179,237,0.25);
    border-top-right-radius: 4px;
  }

  /* 情绪标签 */
  .emotion-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 20px;
    background: rgba(99,179,237,0.1);
    border: 1px solid rgba(99,179,237,0.2);
    color: var(--accent);
    margin-top: 6px;
  }

  /* 输入区 */
  .input-area {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: rgba(10,14,26,0.6);
    backdrop-filter: blur(10px);
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.88rem;
    resize: none;
    outline: none;
    transition: border-color 0.2s;
    min-height: 48px;
    max-height: 120px;
    line-height: 1.5;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--text-muted); }

  .btn {
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    box-shadow: 0 4px 12px var(--glow);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px var(--glow); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-ghost {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-ghost.active { border-color: var(--danger); color: var(--danger); animation: pulse 1s infinite; }

  .tools-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  /* 右侧面板 */
  .right-panel {
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .panel-section {
    padding: 20px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .section-title {
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 14px;
  }

  /* 摄像头区域 */
  .camera-container {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface2);
    border: 1px solid var(--border);
    aspect-ratio: 4/3;
  }
  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  .camera-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10,14,26,0.8);
    font-size: 0.85rem;
    color: var(--text-muted);
    flex-direction: column;
    gap: 8px;
  }
  .camera-overlay.hidden { display: none; }

  /* 情绪结果 */
  .emotion-result {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
  }
  .emotion-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--surface2);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .emotion-label { font-size: 1.1rem; }
  .stress-badge {
    font-size: 0.75rem;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 500;
  }
  .stress-low { background: rgba(104,211,145,0.15); color: var(--accent3); border: 1px solid rgba(104,211,145,0.3); }
  .stress-mid { background: rgba(246,173,85,0.15); color: #f6ad55; border: 1px solid rgba(246,173,85,0.3); }
  .stress-high { background: rgba(252,129,129,0.15); color: var(--danger); border: 1px solid rgba(252,129,129,0.3); }

  /* 图表 */
  #radarChart, #trendChart {
    width: 100%;
    height: 220px;
  }

  /* 加载动画 */
  .thinking {
    display: flex; gap: 4px; align-items: center; padding: 4px 0;
  }
  .thinking span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s infinite;
  }
  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,80%,100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  /* 录音进度 */
  .recording-bar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: rgba(252,129,129,0.1);
    border: 1px solid rgba(252,129,129,0.2);
    border-radius: 8px;
    font-size: 0.8rem;
    color: var(--danger);
    margin-bottom: 8px;
  }
  .recording-bar.show { display: flex; }
  .rec-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--danger);
    animation: pulse 0.8s infinite;
  }

  canvas#snapshot { display: none; }

  .range-btn {
  padding: 3px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  font-size: 0.72rem;
  cursor: pointer;
  font-family: 'Noto Sans SC', sans-serif;
  transition: all 0.2s;
}
.range-btn:hover { border-color: var(--accent); color: var(--accent); }
.range-btn.active { background: rgba(99,179,237,0.15); border-color: var(--accent); color: var(--accent); }

</style>
</head>
<body>

<!-- 登录弹窗 -->
<div id="authModal" style="
  position:fixed; inset:0; z-index:999;
  background:rgba(10,14,26,0.95);
  display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(10px);
">
  <div style="
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:40px;
    width:360px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  ">
    <div style="text-align:center; margin-bottom:28px">
      <div style="font-size:2.5rem; margin-bottom:10px">🪞</div>
      <div style="font-family:'Noto Serif SC',serif; font-size:1.4rem;
        background:linear-gradient(135deg,var(--accent),var(--accent2));
        -webkit-background-clip:text; -webkit-text-fill-color:transparent">
        心语镜像
      </div>
      <div style="color:var(--text-muted); font-size:0.82rem; margin-top:4px">AI 心理陪伴系统</div>
    </div>

    <!-- Tab 切换 -->
    <div style="display:flex; gap:0; margin-bottom:24px; background:var(--surface2); border-radius:10px; padding:4px">
      <button id="tabLogin" onclick="switchTab('login')" style="
        flex:1; padding:8px; border:none; border-radius:8px; cursor:pointer;
        background:var(--accent); color:#fff;
        font-family:'Noto Sans SC',sans-serif; font-size:0.85rem; transition:all 0.2s
      ">登录</button>
      <button id="tabRegister" onclick="switchTab('register')" style="
        flex:1; padding:8px; border:none; border-radius:8px; cursor:pointer;
        background:transparent; color:var(--text-muted);
        font-family:'Noto Sans SC',sans-serif; font-size:0.85rem; transition:all 0.2s
      ">注册</button>
    </div>

    <div style="display:flex; flex-direction:column; gap:12px">
      <input id="authUsername" type="text" placeholder="用户名" style="
        background:var(--surface2); border:1px solid var(--border);
        border-radius:10px; padding:12px 16px; color:var(--text);
        font-family:'Noto Sans SC',sans-serif; font-size:0.88rem; outline:none;
        transition:border-color 0.2s; width:100%
      " onfocus="this.style.borderColor='var(--accent)'"
         onblur="this.style.borderColor='var(--border)'">

      <input id="authPassword" type="password" placeholder="密码（至少6位）" style="
        background:var(--surface2); border:1px solid var(--border);
        border-radius:10px; padding:12px 16px; color:var(--text);
        font-family:'Noto Sans SC',sans-serif; font-size:0.88rem; outline:none;
        transition:border-color 0.2s; width:100%
      " onfocus="this.style.borderColor='var(--accent)'"
         onblur="this.style.borderColor='var(--border)'"
         onkeydown="if(event.key==='Enter') submitAuth()">

      <div id="authError" style="color:var(--danger); font-size:0.8rem; display:none"></div>

      <button onclick="submitAuth()" style="
        padding:12px; border:none; border-radius:10px; cursor:pointer;
        background:linear-gradient(135deg,var(--accent),var(--accent2));
        color:#fff; font-family:'Noto Sans SC',sans-serif;
        font-size:0.9rem; font-weight:500;
        box-shadow:0 4px 12px var(--glow); transition:all 0.2s
      " onmouseover="this.style.transform='translateY(-1px)'"
         onmouseout="this.style.transform='none'"
         id="authSubmitBtn">登录</button>
    </div>
  </div>
</div>


<header>
  <div class="logo">心语镜像 <span>AI 心理陪伴系统</span></div>
  <div class="status-bar">
    <div class="status-dot"><div class="dot active" id="apiDot"></div>服务连接</div>
    <div class="status-dot"><div class="dot" id="camDot"></div>摄像头</div>
    <div class="status-dot"><div class="dot" id="micDot"></div>麦克风</div>
  </div>
</header>

<div class="main">
  <!-- 左侧对话 -->
  <div class="chat-area">
    <div class="chat-messages" id="chatMessages">
      <div class="message ai">
        <div class="avatar ai">🪞</div>
        <div>
          <div class="bubble">
            你好，我是心语镜像。我在这里陪伴你，倾听你的感受。<br><br>
            你可以直接打字和我聊天，也可以点击下方的📸按钮拍下你现在的表情，或者用🎤录音说话。<br><br>
            今天，你感觉怎么样？
          </div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="recording-bar" id="recordingBar">
        <div class="rec-dot"></div>
        <span id="recordingText">正在录音... 0秒</span>
      </div>
      <div class="tools-row">
        <button class="btn btn-ghost" id="btnCamera" onclick="captureAndAnalyze()" title="拍照分析表情">📸 拍照分析</button>
        <button class="btn btn-ghost" id="btnMic" onclick="toggleRecording()" title="语音输入">🎤 语音输入</button>
        <button class="btn btn-ghost" onclick="clearHistory()" title="清空对话">🗑️ 清空对话</button>
      </div>
      <div class="input-row">
        <textarea id="userInput" placeholder="和我说说，你最近怎么了..." rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()">发送 ↑</button>
      </div>
    </div>
  </div>

  <!-- 右侧面板 -->
  <div class="right-panel">
    <!-- 摄像头 -->
    <div class="panel-section">
      <div class="section-title">📸 实时表情</div>
      <div class="camera-container">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="snapshot"></canvas>
        <div class="camera-overlay" id="cameraOverlay">
          <span style="font-size:2rem">📷</span>
          <span>点击「拍照分析」启动摄像头</span>
        </div>
      </div>
      <div class="emotion-result" id="emotionResult" style="display:none">
        <div class="emotion-main">
          <span class="emotion-label" id="emotionLabel">—</span>
          <span class="stress-badge" id="stressBadge">压力值 —</span>
        </div>
      </div>
    </div>

    <!-- 情绪雷达图 -->
    <div class="panel-section">
      <div class="section-title">📊 情绪雷达（近7天）</div>
      <div id="radarChart"></div>
    </div>

    <!-- 压力趋势图 -->
    <div class="panel-section">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; position:sticky; top:0; z-index:10; background:var(--surface); padding: 4px 0;">
    <div class="section-title" style="margin-bottom:0">📈 压力趋势</div>
    <div style="display:flex; gap:6px;">
      <button class="range-btn active" onclick="switchRange(7, this)">近7天</button>
      <button class="range-btn" onclick="switchRange(30, this)">近30天</button>
      <button class="range-btn" onclick="switchRange(90, this)">近3月</button>
    </div>
  </div>
  <div id="trendChart"></div>
</div>

<script src="/config.js"></script>
<script>
const API = window.__API_BASE__ || window.location.origin;
let cameraStarted = false;
let isRecording = false;
let recordingTimer = null;
let recordingSecs = 0;
let mediaRecorder = null;
let recordingStream = null;
let recordedChunks = [];

let currentUser = null;
let authToken = localStorage.getItem('token');
let authMode = 'login';
let radarChart, trendChart;

function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function renderText(text) {
  return escapeHtml(text).replace(/\n/g, '<br>');
}

function authHeaders(extra = {}) {
  const headers = { ...extra };
  if (authToken) headers.Authorization = `Bearer ${authToken}`;
  return headers;
}

async function fetchJSON(path, options = {}) {
  const response = await fetch(`${API}${path}`, options);
  let data = {};
  try {
    data = await response.json();
  } catch (e) {
    data = {};
  }
  if (response.status === 401) {
    localStorage.removeItem('token');
    authToken = null;
    currentUser = null;
    document.getElementById('authModal').style.display = 'flex';
    throw new Error('请先登录');
  }
  if (!response.ok) {
    throw new Error(data.detail || data.error || '请求失败');
  }
  return data;
}

function switchTab(mode) {
  authMode = mode;
  const isLogin = mode === 'login';
  document.getElementById('tabLogin').style.background = isLogin ? 'var(--accent)' : 'transparent';
  document.getElementById('tabLogin').style.color = isLogin ? '#fff' : 'var(--text-muted)';
  document.getElementById('tabRegister').style.background = !isLogin ? 'var(--accent)' : 'transparent';
  document.getElementById('tabRegister').style.color = !isLogin ? '#fff' : 'var(--text-muted)';
  document.getElementById('authSubmitBtn').textContent = isLogin ? '登录' : '注册';
  document.getElementById('authError').style.display = 'none';
}

async function submitAuth() {
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authError');

  if (!username || !password) {
    errEl.textContent = '请填写用户名和密码';
    errEl.style.display = 'block';
    return;
  }

  try {
    const data = await fetchJSON(`/auth/${authMode}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    authToken = data.token;
    currentUser = data.username;
    localStorage.setItem('token', authToken);
    document.getElementById('authModal').style.display = 'none';
    document.querySelector('.logo span').textContent = `· ${currentUser}`;
  } catch (e) {
    errEl.textContent = e.message || '连接失败，请确认后端服务正在运行';
    errEl.style.display = 'block';
  }
}

async function checkAuth() {
  if (!authToken) {
    document.getElementById('authModal').style.display = 'flex';
    return false;
  }
  try {
    const data = await fetchJSON('/auth/me', {
      headers: authHeaders()
    });
    currentUser = data.username;
    document.getElementById('authModal').style.display = 'none';
    document.querySelector('.logo span').textContent = `· ${currentUser}`;
    return true;
  } catch (e) {
    document.getElementById('authModal').style.display = 'flex';
    return false;
  }
}

async function init() {
  await checkAuth();
  checkAPI();
  initCharts();
  if (authToken) {
    loadStats();
  }
}

async function checkAPI() {
  try {
    const r = await fetch(`${API}/health`);
    if (r.ok) document.getElementById('apiDot').classList.add('active');
  } catch (e) {
    document.getElementById('apiDot').classList.remove('active');
  }
}

async function startCamera() {
  if (cameraStarted) return true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    const video = document.getElementById('video');
    video.srcObject = stream;
    document.getElementById('cameraOverlay').classList.add('hidden');
    document.getElementById('camDot').classList.add('active');
    cameraStarted = true;
    return true;
  } catch (e) {
    alert('摄像头启动失败：' + e.message);
    return false;
  }
}

async function captureAndAnalyze() {
  if (!authToken) {
    document.getElementById('authModal').style.display = 'flex';
    return;
  }
  const started = await startCamera();
  if (!started) return;
  await new Promise(r => setTimeout(r, 500));

  const video = document.getElementById('video');
  const canvas = document.getElementById('snapshot');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const frames = [];
  for (let i = 0; i < 5; i++) {
    canvas.getContext('2d').drawImage(video, 0, 0);
    frames.push(canvas.toDataURL('image/jpeg', 0.8).split(',')[1]);
    await new Promise(r => setTimeout(r, 200));
  }

  addMessage('ai', '正在分析 5 帧表情，请稍候...', true);

  try {
    const data = await fetchJSON('/analyze/emotion', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ image: frames[0], frames })
    });

    showEmotionResult(data);

    await fetchJSON('/emotions/save', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({
        dominant_emotion: data.dominant_emotion_cn,
        stress_score: data.stress_score,
        emotions: data.emotions,
        source: 'camera'
      })
    });

    const emotionMsg = `[系统检测到我的表情（${data.frames_analyzed}帧平均）：${data.dominant_emotion_cn}，压力值 ${data.stress_score}/100]`;
    addMessage('user', emotionMsg, true);
    await sendToAI(emotionMsg);
    loadStats();
  } catch (e) {
    alert(e.message || '分析失败');
  }
}

function showEmotionResult(data) {
  document.getElementById('emotionResult').style.display = 'flex';
  document.getElementById('emotionLabel').textContent = `${data.dominant_emotion_cn} ${getEmotionEmoji(data.dominant_emotion)}`;

  const badge = document.getElementById('stressBadge');
  badge.textContent = `压力值 ${data.stress_score}/100`;
  badge.className = 'stress-badge ' + (
    data.stress_score < 30 ? 'stress-low' :
    data.stress_score < 60 ? 'stress-mid' : 'stress-high'
  );
}

function getEmotionEmoji(e) {
  const map = { happy:'😊', sad:'😢', angry:'😠', fear:'😨', surprise:'😲', disgust:'😒', neutral:'😐' };
  return map[e] || '🙂';
}

async function toggleRecording() {
  if (!authToken) {
    document.getElementById('authModal').style.display = 'flex';
    return;
  }
  if (!isRecording) {
    await startRecording();
  } else {
    stopRecording();
  }
}

async function startRecording() {
  try {
    recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(recordingStream);
    recordedChunks = [];

    mediaRecorder.ondataavailable = (event) => {
      if (event.data.size > 0) recordedChunks.push(event.data);
    };
    mediaRecorder.onstop = uploadRecording;

    isRecording = true;
    recordingSecs = 0;
    document.getElementById('btnMic').classList.add('active');
    document.getElementById('btnMic').textContent = '⏹️ 停止录音';
    document.getElementById('micDot').classList.add('active');
    document.getElementById('recordingBar').classList.add('show');
    document.getElementById('recordingText').textContent = '正在录音... 0秒';

    recordingTimer = setInterval(() => {
      recordingSecs++;
      document.getElementById('recordingText').textContent = `正在录音... ${recordingSecs}秒`;
      if (recordingSecs >= 15) stopRecording();
    }, 1000);

    mediaRecorder.start();
  } catch (e) {
    alert('麦克风启动失败：' + e.message);
    cleanupRecordingUI();
  }
}

function stopRecording() {
  if (!isRecording) return;
  isRecording = false;
  clearInterval(recordingTimer);
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  } else {
    cleanupRecordingUI();
  }
}

async function uploadRecording() {
  try {
    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
    const formData = new FormData();
    formData.append('file', blob, 'recording.webm');
    const data = await fetchJSON('/analyze/speech/upload', {
      method: 'POST',
      headers: authHeaders(),
      body: formData
    });
    if (data.text) {
      document.getElementById('userInput').value = data.text;
      autoResize(document.getElementById('userInput'));
    }
    if (data.error) {
      alert(data.error);
    }
  } catch (e) {
    alert(e.message || '语音识别失败');
  } finally {
    if (recordingStream) {
      recordingStream.getTracks().forEach(track => track.stop());
    }
    mediaRecorder = null;
    recordingStream = null;
    recordedChunks = [];
    cleanupRecordingUI();
  }
}

function cleanupRecordingUI() {
  isRecording = false;
  clearInterval(recordingTimer);
  document.getElementById('btnMic').classList.remove('active');
  document.getElementById('btnMic').textContent = '🎤 语音输入';
  document.getElementById('micDot').classList.remove('active');
  document.getElementById('recordingBar').classList.remove('show');
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

async function sendMessage() {
  if (!authToken) {
    document.getElementById('authModal').style.display = 'flex';
    return;
  }
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  autoResize(input);
  addMessage('user', text);
  await sendToAI(text);
}

async function sendToAI(text) {
  document.getElementById('sendBtn').disabled = true;

  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'message ai';
  div.innerHTML = `
    <div class="avatar ai">🪞</div>
    <div><div class="bubble" id="streamBubble"><div class="thinking"><span></span><span></span><span></span></div></div></div>
  `;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;

  try {
    const response = await fetch(`${API}/chat/stream`, {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ message: text })
    });

    if (response.status === 401) {
      throw new Error('请先登录');
    }
    if (!response.ok || !response.body) {
      throw new Error('对话请求失败');
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    const bubble = document.getElementById('streamBubble');
    bubble.innerHTML = '';
    let fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const token = decoder.decode(value, { stream: true });
      fullText += token;
      bubble.innerHTML = renderText(fullText);
      bubble.id = '';
      container.scrollTop = container.scrollHeight;
    }
  } catch (e) {
    const bubble = document.getElementById('streamBubble');
    if (bubble) bubble.innerHTML = renderText(e.message || '连接失败，请确认后端服务正在运行');
  }

  document.getElementById('sendBtn').disabled = false;
}

function addMessage(role, text, isSystem = false) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `message ${role === 'ai' ? 'ai' : 'user'}`;

  const avatarClass = role === 'ai' ? 'ai' : 'user-av';
  const avatarIcon = role === 'ai' ? '🪞' : '🙂';

  div.innerHTML = `
    <div class="avatar ${avatarClass}">${avatarIcon}</div>
    <div>
      <div class="bubble" style="${isSystem ? 'opacity:0.6;font-size:0.8rem' : ''}">${renderText(text)}</div>
    </div>
  `;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

async function clearHistory() {
  try {
    await fetchJSON('/chat/history', {
      method: 'DELETE',
      headers: authHeaders()
    });
    document.getElementById('chatMessages').innerHTML = '';
    addMessage('ai', '对话记录已清空，我们重新开始吧。你今天怎么样？');
  } catch (e) {
    alert(e.message || '清空失败');
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function initCharts() {
  radarChart = echarts.init(document.getElementById('radarChart'), null, { renderer: 'canvas' });
  trendChart = echarts.init(document.getElementById('trendChart'), null, { renderer: 'canvas' });

  radarChart.setOption({
    backgroundColor: 'transparent',
    radar: {
      indicator: [
        { name: '开心', max: 100 }, { name: '平静', max: 100 },
        { name: '悲伤', max: 100 }, { name: '恐惧', max: 100 },
        { name: '愤怒', max: 100 }, { name: '厌恶', max: 100 }
      ],
      axisLine: { lineStyle: { color: 'rgba(99,179,237,0.15)' } },
      splitLine: { lineStyle: { color: 'rgba(99,179,237,0.1)' } },
      splitArea: { areaStyle: { color: ['rgba(99,179,237,0.02)', 'rgba(99,179,237,0.05)'] } },
      name: { textStyle: { color: '#718096', fontSize: 11 } }
    },
    series: [{ type: 'radar', data: [{ value: [0,0,0,0,0,0], name: '情绪分布' }],
      lineStyle: { color: '#63b3ed' },
      areaStyle: { color: 'rgba(99,179,237,0.15)' },
      itemStyle: { color: '#63b3ed' }
    }]
  });

  trendChart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 30, right: 10, top: 10, bottom: 30 },
    xAxis: { type: 'category', data: [], axisLine: { lineStyle: { color: '#2d3748' } }, axisLabel: { color: '#718096', fontSize: 10 } },
    yAxis: { type: 'value', min: 0, max: 100, axisLine: { lineStyle: { color: '#2d3748' } }, splitLine: { lineStyle: { color: 'rgba(99,179,237,0.08)' } }, axisLabel: { color: '#718096', fontSize: 10 } },
    series: [{ type: 'line', data: [], smooth: true,
      lineStyle: { color: '#9f7aea', width: 2 },
      itemStyle: { color: '#9f7aea' },
      areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
        colorStops: [{ offset: 0, color: 'rgba(159,122,234,0.3)' }, { offset: 1, color: 'rgba(159,122,234,0.02)' }]
      }}
    }]
  });
}

async function loadStats(days = 7) {
  if (!authToken) return;
  try {
    const [stats, trend] = await Promise.all([
      fetchJSON(`/emotions/stats?days=${days}`, { headers: authHeaders() }),
      fetchJSON(`/emotions/trend?days=${days}`, { headers: authHeaders() })
    ]);

    const emotionKeys = ['开心', '平静', '悲伤', '恐惧', '愤怒', '厌恶'];
    const values = emotionKeys.map(k => stats[k] || 0);
    radarChart.setOption({
      series: [{ data: [{ value: values, name: '情绪分布' }] }]
    });

    const dates = trend.map(r => String(r.day).slice(5));
    const scores = trend.map(r => Math.round(r.avg_stress || 0));
    const counts = trend.map(r => r.count || 0);

    trendChart.setOption({
      tooltip: {
        trigger: 'axis',
        backgroundColor: 'rgba(17,24,39,0.9)',
        borderColor: 'rgba(99,179,237,0.2)',
        textStyle: { color: '#e2e8f0', fontSize: 12 },
        formatter: (params) => {
          const p = params[0];
          return `${p.name}<br/>压力均值：${p.value}<br/>记录次数：${counts[p.dataIndex]}`;
        }
      },
      xAxis: { data: dates },
      series: [{ data: scores }]
    });
  } catch (e) {
    console.log('图表加载失败', e.message);
  }
}

function switchRange(days, btn) {
  document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadStats(days);
}

init();
</script>
